[tox]
isolated_build = True
toxworkdir={env:TOX_WORK_DIR:.tox}
envlist = py{312,313,314,315}-django{520,600,610}

[testenv]
runner = uv-venv-runner
allowlist_externals =
    bash
deps =
    django520: django>=5.2,<5.3
    django600: django>=6.0,<6.1
    django610: django>=6.1,<6.2
setenv =
    PYTHONWARNINGS = d
commands =
    mypy asymmetric_jwt_auth
    coverage erase
    coverage run --branch --source asymmetric_jwt_auth {toxinidir}/sandbox/manage.py test --noinput asymmetric_jwt_auth
    - coverage report -m
